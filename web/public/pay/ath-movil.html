<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ATH Movil Checkout</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #071224;
        color: #f8fafc;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      }
      .panel {
        width: min(92vw, 460px);
        border: 1px solid rgba(244, 196, 48, 0.3);
        border-radius: 16px;
        background: rgba(12, 35, 64, 0.9);
        padding: 20px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      }
      h1 {
        margin: 0;
        font-size: 1.2rem;
        color: #f4c430;
      }
      p {
        margin: 10px 0 0;
        font-size: 0.95rem;
        color: rgba(248, 250, 252, 0.9);
      }
      .muted {
        color: rgba(248, 250, 252, 0.7);
      }
      .mono {
        margin-top: 12px;
        padding: 10px;
        border-radius: 10px;
        background: rgba(0, 0, 0, 0.2);
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace;
        font-size: 0.75rem;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <h1>ATH Movil</h1>
      <p id="status">Preparing ATH checkout...</p>
      <p class="muted">Keep this page open while ATH confirms your transaction.</p>
      <p id="reference" class="mono"></p>
      <div id="ATHMovil_Checkout_Button_payment"></div>
    </main>
    <script>
      (function () {
        var CHECKOUT_SESSION_KEY = "ricos:ath-checkout";
        var statusEl = document.getElementById("status");
        var referenceEl = document.getElementById("reference");

        function setStatus(text) {
          if (statusEl) statusEl.textContent = text;
        }

        function redirectToCheckout() {
          window.location.replace("/checkout");
        }

        function parseStatus(payload) {
          if (!payload || typeof payload !== "object") return null;
          var direct = payload.ecommerceStatus;
          if (typeof direct === "string") return direct.toUpperCase();
          var data = payload.data;
          if (data && typeof data === "object" && typeof data.ecommerceStatus === "string") {
            return data.ecommerceStatus.toUpperCase();
          }
          return null;
        }

        function parseEcommerceId(payload) {
          if (!payload || typeof payload !== "object") return "";
          if (typeof payload.ecommerceId === "string") return payload.ecommerceId;
          var data = payload.data;
          if (data && typeof data === "object" && typeof data.ecommerceId === "string") {
            return data.ecommerceId;
          }
          return "";
        }

        var url = new URL(window.location.href);
        var referenceFromQuery = (url.searchParams.get("reference") || "").trim();
        if (!referenceFromQuery) {
          redirectToCheckout();
          return;
        }

        var raw;
        try {
          raw = window.sessionStorage.getItem(CHECKOUT_SESSION_KEY);
        } catch (_err) {
          redirectToCheckout();
          return;
        }
        if (!raw) {
          redirectToCheckout();
          return;
        }

        var parsed;
        try {
          parsed = JSON.parse(raw);
        } catch (_err) {
          redirectToCheckout();
          return;
        }
        if (
          !parsed ||
          typeof parsed !== "object" ||
          parsed.reference !== referenceFromQuery ||
          !parsed.config ||
          typeof parsed.config !== "object"
        ) {
          redirectToCheckout();
          return;
        }

        referenceEl.textContent = "reference: " + referenceFromQuery;
        window.__athCheckoutPayload = parsed;
        window.__athCheckoutRef = referenceFromQuery;
        setStatus("Tap the ATH button to continue.");
        window.__parseAthStatus = parseStatus;
        window.__parseAthEcommerceId = parseEcommerceId;
      })();
    </script>
    <script src="https://payments.athmovil.com/api/modal/js/athmovil_base.js"></script>
    <script type="text/javascript">
      const ATHM_Checkout = window.__athCheckoutPayload.config;

      async function authorizationATHM() {
        try {
          const responseAuth = await authorization();
          console.log("authorizationATHM", responseAuth);
          const finalStatus = window.__parseAthStatus(responseAuth);
          if (finalStatus !== "COMPLETED") {
            throw new Error("ATH payment is not completed");
          }

          const ecommerceId = window.__parseAthEcommerceId(responseAuth);
          sessionStorage.removeItem("ricos:ath-checkout");

          const successParams = new URLSearchParams({
            provider: "ath-movil",
            reference: window.__athCheckoutRef,
          });
          if (ecommerceId) successParams.set("ecommerceId", ecommerceId);
          window.location.replace("/order/success?" + successParams.toString());
        } catch (err) {
          console.error("authorizationATHM failed", err);
          document.getElementById("status").textContent =
            "ATH authorization failed. Returning to checkout...";
          setTimeout(function () {
            window.location.replace("/checkout");
          }, 1200);
        }
      }

      async function cancelATHM() {
        try {
          const responseCancel = await findPaymentATHM();
          console.log("cancelATHM", responseCancel);
        } catch (err) {
          console.error("cancelATHM failed", err);
        }
        sessionStorage.removeItem("ricos:ath-checkout");
        window.location.replace("/checkout");
      }

      async function expiredATHM() {
        try {
          const responseExpired = await findPaymentATHM();
          console.log("expiredATHM", responseExpired);
        } catch (err) {
          console.error("expiredATHM failed", err);
        }
        sessionStorage.removeItem("ricos:ath-checkout");
        window.location.replace("/checkout");
      }

      (function autoOpenAthModal() {
        var attempts = 0;
        var maxAttempts = 20;
        var intervalMs = 400;

        function modalIsRendered() {
          var modal = document.getElementById("athmOpenModal");
          return !!(modal && modal.innerHTML && modal.innerHTML.trim().length > 0);
        }

        function tryOpen() {
          if (modalIsRendered()) {
            return;
          }
          attempts += 1;
          document.getElementById("status").textContent = "Opening ATH checkout...";

          if (typeof window.createDivButtonPayment === "function") {
            try {
              window.createDivButtonPayment();
            } catch (err) {
              console.error("ATH createDivButtonPayment failed", err);
            }
          }

          var button = document.getElementById("buttonATHMBP");
          if (button && typeof button.click === "function") {
            button.click();
          } else if (typeof window.sendATHMPayment === "function") {
            try {
              window.sendATHMPayment();
            } catch (err) {
              console.error("ATH sendATHMPayment failed", err);
            }
          }

          if (modalIsRendered()) {
            return;
          }
          if (attempts >= maxAttempts) {
            document.getElementById("status").textContent = "Tap the ATH button to continue.";
            return;
          }

          setTimeout(tryOpen, intervalMs);
        }

        tryOpen();
      })();
    </script>
  </body>
</html>
