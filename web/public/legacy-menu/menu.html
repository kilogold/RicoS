<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Menú | Ricos</title>
  <link rel="icon" href="/legacy-menu/images/favicon.png" sizes="32x32">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
      font-size: 15px;
      line-height: 1.65;
      color: #000;
      background: #fff;
    }
    .site-header {
      border-bottom: 1px solid #e5e5e5;
      background: #fff;
      min-height: 70px;
      display: flex;
      align-items: center;
      padding: 0 20px;
    }
    .site-header a { display: inline-block; line-height: 0; }
    .site-header img {
      max-width: 120px;
      width: 120px;
      height: auto;
    }
    .site-content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }
    .menu-images img {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 0 auto;
    }
    .site-footer {
      background: #000;
      color: #fff;
      text-align: center;
      padding: 20px 35px;
      min-height: 80px;
    }
    .site-footer p { margin: 0; }
    .site-footer a { color: #ff0000; text-decoration: none; }
    .site-footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header class="site-header">
    <a href="/" rel="home">
      <img src="/legacy-menu/images/ricos_logo.png" alt="Ricos" width="120" height="62" decoding="async">
    </a>
  </header>

  <main class="site-content">
    <div class="menu-images">
      <p><img fetchpriority="high" decoding="async" src="/legacy-menu/images/menu-0.jpg" alt="" width="1350" height="2250"></p>
      <p><img loading="lazy" decoding="async" src="/legacy-menu/images/menu-1.jpg" alt="" width="1200" height="2000"></p>
      <p><img loading="lazy" decoding="async" src="/legacy-menu/images/menu-2.jpg" alt="" width="1200" height="2000"></p>
      <p><img loading="lazy" decoding="async" src="/legacy-menu/images/menu-3.jpg" alt="" width="1200" height="2000"></p>
      <p><img loading="lazy" decoding="async" src="/legacy-menu/images/menu-4.jpg" alt="" width="1200" height="2000"></p>
      <p><img loading="lazy" decoding="async" src="/legacy-menu/images/menu-5.jpg" alt="" width="1200" height="2000"></p>
      <p><img loading="lazy" decoding="async" src="/legacy-menu/images/menu-6.jpg" alt="" width="1200" height="2000"></p>
      <p><img loading="lazy" decoding="async" src="/legacy-menu/images/menu-7.jpg" alt="" width="1200" height="2000"></p>
    </div>
  </main>

  <footer class="site-footer">
    <p><span>Copyright &copy; 2026 Ricos | Design by</span> <a href="https://qostudio.com">Qo Studio</a></p>
  </footer>
</body>
</html>
